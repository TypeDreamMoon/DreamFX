; DreamFX test host -- engine config.
;
; This host stands in for DevTest (I:\UnrealProject_Moon\DEV_58\DevTest), the project DreamFX is developed in.
; Values taken from DevTest's Config/DefaultEngine.ini are copied verbatim, because several of them feed the
; shader cache keys: Niagara compiles a compute shader for every GPU emitter and a material for every renderer,
; and a host that agrees with DevTest on these keys reads DevTest's already-warm derived data cache instead of
; compiling them again on its first launch.
;
; There is deliberately no derived-data-cache section. On this engine the cache that is actually read and
; written is the local Zen store, which is machine-wide rather than per project (BaseEngine.ini,
; [Zen.AutoLaunch] DataPath and the ue.ddc namespace). Leaving the cache graph alone is what makes this host
; share DevTest's cache -- anything written here could only split the two.

[/Script/EngineSettings.GameMapsSettings]
; The lightest map the engine ships that still gives the editor a level: one PlayerStart. DevTest starts on a
; full showcase level, which every corpus run -- -nullrhi included -- would load before its first test.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry

[/Script/Engine.RendererSettings]
; Copied verbatim from DevTest. These feed the shader map keys; one value different here and the first
; launch compiles its shaders from nothing.
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.EarlyZPassOnlyMaterialMasking=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.CustomDepth=3
r.RayTracing.Shadows=True
r.Mobile.AntiAliasing=4
r.AntiAliasingMethod=4

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Copied from DevTest: the RHI and the targeted shader formats decide which shader platform the editor
; compiles for, and the platform is part of every shader cache key.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.MoonToonSettings]
; This engine's toon subsystem loads two ramp atlases at engine start (UMoonToonSubsystem::Initialize).
; Their /MoonToon mount belongs to DevTest's own MoonToon project plugin, which this host does not carry,
; so the defaults would only log two failed loads on every launch. None skips the load.
GlobalDiffuseColorRampAtlas=None
GlobalSpecularColorRampAtlas=None

[DevOptions.Shaders]
; Copied from DevTest: same machine, so the same share of cores is left to the shader compile workers.
PercentageUnusedShaderCompilingThreads=25
